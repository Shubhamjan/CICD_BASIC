#          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
#          --health-interval=10s
#          --health-timeout=5s
#          --health-retries=5
#
#    env:
#      SPRING_PROFILES_ACTIVE: local
#      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/user_db
#      SPRING_DATASOURCE_USERNAME: testuser
#      SPRING_DATASOURCE_PASSWORD: testpass

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Build and Test
        run: mvn clean verify

#      - name: Build Docker Image
#        run: docker build -t cicd-app .
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd:latest
#          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd:${{ github.sha }}