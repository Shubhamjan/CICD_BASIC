name: Spring Boot CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

#    services:
#      mysql:
#        image: mysql:8.0
#        env:
#          MYSQL_ROOT_PASSWORD: root
#          MYSQL_DATABASE: user_db
#          MYSQL_USER: testuser
#          MYSQL_PASSWORD: testpass
#        ports:
#          - 3306:3306
